name: ACE Desk - Android
on:
  push:
    branches: [acedesk-android]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - run: gradle :app:assembleRelease --no-daemon
      - run: cp app/build/outputs/apk/release/app-release.apk ACEDesk.apk
      - uses: actions/upload-artifact@v4
        with: { name: ACEDesk-android, path: ACEDesk.apk }
